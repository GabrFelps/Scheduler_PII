<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Tarefas - Login</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <button id="darkToggle" class="dark-toggle" title="Alternar modo escuro">🌙</button>

  <div id="login-section" class="card" style="padding: 2rem; max-width: 400px; margin-top: 10vh;">
    <div class="card-header" style="justify-content: center; border: none;">
        <h2>Acesso ao Sistema</h2>
    </div>
    <div class="card-body">
        <div id="input-section">
            <label for="loginUser">Usuário</label>
            <input type="text" id="loginUser" placeholder="Digite seu usuário">
            
            <label for="loginPass" style="margin-top: 10px;">Senha</label>
            <input type="password" id="loginPass" placeholder="Digite sua senha">
        </div>
        
        <p id="loginMessage" style="color: red; text-align: center; display: none; margin-top: 10px;"></p>

        <button id="btnLogin" class="primary-btn" style="width: 100%;">Entrar</button>
        <button id="btnRegister" class="primary-btn" style="width: 100%; background-color: #6b7280; margin-top: 5px;">Criar Conta</button>
    </div>
  </div>
  <div class="container" id="main-app" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Lista de Tarefas</h1>
        <button id="btnLogout" class="action-btn" style="font-size: 0.8rem; border: 1px solid currentColor; border-radius: 5px;">Sair</button>
    </div>

    <div id="input-section">
      <label for="descricaoTarefa">Escreva uma nova tarefa:</label>
      <input type="text" id="descricaoTarefa" placeholder="Ex: Estudar pra prova de Engenharia de Software II">
      <label id="errorMessage" style="display: none;"></label>
    </div>

    <button id="adicionarBtn" class="primary-btn">Adicionar tarefa</button>
    <button id="removerTodasBtn" class="primary-btn">Remover Todas as Tarefas</button>

    <div class="table-wrapper">
      <table id="tabelaTarefas">
        <thead>
          <tr>
            <th>ID</th>
            <th>Descrição</th>
            <th>Início</th>
            <th>Conclusão</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="noTasksMessage">Sem tarefas adicionadas.</div>

    <div id="modalContainer"></div>
  </div>

</body>
</html>
